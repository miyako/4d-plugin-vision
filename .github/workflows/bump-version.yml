name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: vision-source-bump
  cancel-in-progress: false

jobs:
  bump:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump source and push selected branch only
        env:
          MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/bump.py "$MODE" --sha "$GITHUB_SHA" --ref "$GITHUB_REF"
